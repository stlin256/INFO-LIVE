name: Hourly InfoLive Feed & Deploy

on:
  schedule:
    - cron: '17 * * * *'  # Every hour at :17 UTC; avoids the top-of-hour scheduler peak
  workflow_dispatch:      # Allows manual trigger at any time
  push:
    branches: [master, main]
    # Feed persistence commits touch data/; do not let output commits compete
    # with the hourly schedule. Code/config pushes still deploy immediately.
    paths-ignore:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/**'
      - 'data/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: feed-and-deploy
  cancel-in-progress: false

jobs:
  dedupe:
    name: Skip duplicate run in the same UTC hour
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether this commit was already processed this hour
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pushes and manual runs are intentional; only the two scheduled
          # offsets need same-hour deduplication. The old check looked for any
          # historical success on this commit, so an unchanged commit prevented
          # every later hourly run.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_hour=$(date -u +"%Y-%m-%dT%H")
          same_hour_count=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow hourly-feed.yml \
            --commit "$COMMIT_SHA" \
            --json databaseId,status,conclusion,createdAt \
            --limit 50 \
            | jq --arg current_run_id "$CURRENT_RUN_ID" --arg current_hour "$current_hour" '[.[]
              | select((.databaseId | tostring) != $current_run_id)
              | select(.createdAt | startswith($current_hour))
              | select(.status == "queued" or .status == "in_progress" or .conclusion == "success")
            ] | length')
          if (( same_hour_count > 0 )); then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A scheduled run for $COMMIT_SHA already exists this UTC hour; skipping the duplicate scheduled run."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  feed-and-deploy:
    needs: dedupe
    if: needs.dedupe.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate AI translation pipeline configuration
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: |
          if [[ -z "$AI_API_KEY" || -z "$AI_API_BASE" ]]; then
            echo "::error::AI_API_KEY and AI_API_BASE are required for full-article translation. The run is stopped before ingestion so the previous Pages deployment remains intact."
            exit 1
          fi

      - name: InfoLive Feed Ingestion & AI Intelligence Synthesis
        run: node scripts/feed-engine.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_FALLBACK_MODEL: ${{ secrets.AI_FALLBACK_MODEL || 'gpt-5.6-luna' }}
          ARTICLE_BODY_ENRICH_LIMIT: 120
          AI_MAX_CONCURRENCY: 8
          AI_TRANSLATOR_CONCURRENCY: 4
          AI_ARTICLE_LIMIT: 96
          AI_ANALYSIS_ARTICLE_LIMIT: 12
          AI_MAX_TOTAL_CALLS: 384
          AI_MAX_FALLBACK_CALLS: 96

      - name: Build static site
        run: npm run build
        env:
          ASTRO_BASE: '/INFO-LIVE/'

      - name: Write build identity manifest
        run: node scripts/write-deploy-manifest.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Verify build artifact and content quality
        run: npm run verify:content
        env:
          ASTRO_BASE: '/INFO-LIVE/'

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true

      - name: Verify all published GitHub Pages routes and content quality
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/verify-content.mjs --url "$PAGES_URL" --build-id "${GITHUB_SHA}:${GITHUB_RUN_ID}" --retries 36 --delay 10000

      - name: Persist verified intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): auto-update verified global intel stream [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then
                echo "Persisted verified intelligence data on attempt $attempt."
                exit 0
              fi
              echo "Push raced with another master update; rebasing before retry $((attempt + 1))."
              git fetch origin master
              git rebase origin/master
            done
            echo "::error::Unable to persist verified intelligence data after three push attempts."
            exit 1
          else
            echo "No intelligence updates to commit."
          fi