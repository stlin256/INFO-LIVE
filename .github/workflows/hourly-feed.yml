name: Hourly InfoLive Feed & Deploy

on:
  schedule:
    - cron: '0 * * * *'   # Runs every hour on the hour
  workflow_dispatch:      # Allows manual trigger at any time
  push:
    branches: [master, main]
    paths-ignore:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: feed-and-deploy
  cancel-in-progress: false

jobs:
  feed-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: InfoLive Feed Ingestion & AI Intelligence Synthesis
        run: node scripts/feed-engine.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_FALLBACK_MODEL: ${{ secrets.AI_FALLBACK_MODEL || 'gpt-5.6-luna' }}

      - name: Build static site
        run: npm run build

      - name: Verify build artifact and content quality
        run: npm run verify:content

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true

      - name: Verify all published GitHub Pages routes and content quality
        run: node scripts/verify-content.mjs --url https://stlin256.github.io/INFO-LIVE/ --retries 12 --delay 5000

      - name: Persist verified intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): auto-update verified global intel stream [skip ci]"
            git push
          else
            echo "No intelligence updates to commit."
          fi
